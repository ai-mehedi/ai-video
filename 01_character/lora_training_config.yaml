# ============================================================================
# CHARACTER LoRA TRAINING CONFIG  —  ai-toolkit (ostris)  —  FLUX.1-dev
# This trains YOUR face into FLUX so every shot has your real, consistent face.
# Tuned for a 48GB GPU (A6000/A40/L40/6000 Ada).
#
# HOW TO USE:
#   1. git clone https://github.com/ostris/ai-toolkit && cd ai-toolkit
#      pip install -r requirements.txt
#   2. Put 15-40 photos of yourself in:  ai-project/01_character/dataset/
#      (front, 3/4 left, 3/4 right, profile, neutral+smile+serious, sharp, even light)
#   3. (Optional but better) put a .txt caption next to each image, same filename.
#      Example shot01.jpg -> shot01.txt containing: "myhero, a man, looking at camera"
#      Always start every caption with your trigger word: myhero
#   4. Edit the two PATHS marked  <<< EDIT  below.
#   5. Run:  python run.py  ai-project/01_character/lora_training_config.yaml
#   6. Result LoRA appears in output/ -> copy to ComfyUI/models/loras/
# ============================================================================
---
job: extension
config:
  name: "myhero_flux"                       # <-- your LoRA name (becomes filename)
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/ai-project/01_character/output"   # <<< EDIT output path
      device: cuda:0
      trigger_word: "myhero"                # <-- you type this in every prompt later

      network:
        type: "lora"
        linear: 16                          # LoRA rank. 16 = good for a face. 32 if you want stronger.
        linear_alpha: 16

      save:
        dtype: float16
        save_every: 250                     # saves a checkpoint every 250 steps
        max_step_saves_to_keep: 4           # keep the last 4 (pick the best one later)

      datasets:
        - folder_path: "/workspace/ai-project/01_character/dataset"  # <<< EDIT your photos folder
          caption_ext: "txt"
          caption_dropout_rate: 0.05        # randomly drops captions -> better generalization
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 768, 1024 ]         # 48GB handles 1024 easily; multi-res = more robust

      train:
        batch_size: 1
        steps: 2500                         # 2000-3000 is the sweet spot for a face
        gradient_accumulation_steps: 1
        train_unet: true
        train_text_encoder: false           # keep false for FLUX face LoRA
        gradient_checkpointing: true        # saves VRAM, keep on
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4                            # FLUX LoRA default; don't change unless you know why
        ema_config:
          use_ema: true
          ema_decay: 0.99
        dtype: bf16

      model:
        name_or_path: "black-forest-labs/FLUX.1-dev"
        is_flux: true
        quantize: true                      # true = safe & fast. On 48GB you CAN set false for
                                            # slightly higher quality (uses more VRAM).

      # Test images generated DURING training so you can watch your face appear:
      sample:
        sampler: "flowmatch"
        sample_every: 250
        width: 1024
        height: 1024
        guidance_scale: 4
        sample_steps: 20
        seed: 42
        walk_seed: true
        neg: ""                             # FLUX ignores negatives, leave empty
        prompts:
          - "myhero, cinematic film still, close-up portrait, natural skin texture, soft light"
          - "myhero, medium shot, standing on a rooftop at night, neon city lights, serious face"
          - "myhero, sweating, wet skin, dramatic lighting, intense expression, film grain"
          - "myhero, wide shot, walking down a rainy street, moody cinematic lighting"

meta:
  name: "myhero_flux"
  version: '1.0'

# ----------------------------------------------------------------------------
# AFTER TRAINING — pick the best checkpoint:
#   Look at the sample images. Choose the step where your face is accurate but
#   NOT over-baked (over-trained = same expression always, stiff, plastic).
#   Usually step 1500-2500. Copy that .safetensors to ComfyUI/models/loras/.
#
# IF FACE IS WRONG:  add more varied photos, retrain.
# IF FACE IS STIFF/PLASTIC:  use an EARLIER checkpoint, or lower LoRA weight to 0.7 in ComfyUI.
# ----------------------------------------------------------------------------
